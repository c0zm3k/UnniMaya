{% extends "layout.html" %}
{% block content %}
<h2>Admin Dashboard</h2>
<div class="stats-grid">
    <a href="{{ url_for('admin_bp.view_users') }}" class="text-decoration-none">
        <div class="stat-card stat-users">
            <h3>{{ users_count }}</h3>
            <p>Total Users</p>
        </div>
    </a>
    <a href="{{ url_for('admin_bp.view_courses') }}" class="text-decoration-none">
        <div class="stat-card stat-courses">
            <h3>{{ courses_count }}</h3>
            <p>Total Courses</p>
        </div>
    </a>
    <a href="{{ url_for('admin_bp.view_colleges') }}" class="text-decoration-none">
        <div class="stat-card stat-colleges">
            <h3>{{ colleges_count }}</h3>
            <p>Total Colleges</p>
        </div>
    </a>
</div>

<div class="row mt-4">
    <div class="col-md-6 mb-3">
        <a href="{{ url_for('admin_bp.new_course') }}" class="btn btn-neon w-100 p-3">
            <i class="fas fa-plus-circle"></i> Add New Course
        </a>
    </div>
    <div class="col-md-6 mb-3">
        <a href="{{ url_for('admin_bp.new_college') }}" class="btn btn-neon w-100 p-3">
            <i class="fas fa-university"></i> Add New College
        </a>
    </div>
</div>
{% endblock %}
