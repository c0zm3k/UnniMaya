{% extends "layout.html" %}
{% block content %}
<div class="content-section">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="text-primary">Manage Courses</h2>
        <a href="{{ url_for('admin_bp.new_course') }}" class="btn btn-neon btn-sm">Add New Course</a>
    </div>
    <div class="table-responsive">
        <table class="table table-dark table-hover table-striped">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Title</th>
                    <th>Description</th>
                    <th>Skills Required</th>
                </tr>
            </thead>
            <tbody>
                {% for course in courses %}
                <tr>
                    <td>{{ course.id }}</td>
                    <td>{{ course.title }}</td>
                    <td>{{ course.description[:50] }}...</td>
                    <td>{{ course.skills_required }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
    <a href="{{ url_for('admin_bp.dashboard') }}" class="btn btn-secondary mt-3">Back to Dashboard</a>
</div>
{% endblock %}
