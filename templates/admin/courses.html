{% extends "layout.html" %}
{% block content %}
<div class="nm-flat p-10 mt-12">
    <div class="flex flex-col md:flex-row justify-between items-center mb-10 gap-6">
        <h2 class="font-orbitron text-2xl font-bold text-nm-text tracking-widest uppercase">Curriculum Hub</h2>
        <div class="flex gap-4">
            <a href="{{ url_for('admin_bp.new_course') }}"
                class="nm-btn rounded-xl py-2 px-6 text-sm font-bold text-nm-primary flex items-center gap-2">
                <i class="bi bi-plus-circle-fill"></i> New Course
            </a>
            <a href="{{ url_for('admin_bp.dashboard') }}"
                class="nm-btn rounded-xl py-2 px-6 text-sm font-semibold flex items-center gap-2">
                <i class="bi bi-arrow-left"></i> Dashboard
            </a>
        </div>
    </div>

    <div class="nm-inset p-2 rounded-3xl overflow-hidden shadow-inner">
        <div class="overflow-x-auto">
            <table class="w-full text-left">
                <thead class="bg-nm-text bg-opacity-5">
                    <tr>
                        <th class="px-6 py-4 text-[10px] font-bold uppercase tracking-widest opacity-40">ID</th>
                        <th class="px-6 py-4 text-[10px] font-bold uppercase tracking-widest opacity-40">Title</th>
                        <th class="px-6 py-4 text-[10px] font-bold uppercase tracking-widest opacity-40">Curriculum Meta
                        </th>
                        <th class="px-6 py-4 text-[10px] font-bold uppercase tracking-widest opacity-40">Skills Registry
                        </th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-nm-text divide-opacity-5">
                    {% for course in courses %}
                    <tr class="hover:bg-nm-text hover:bg-opacity-[0.02] transition-colors">
                        <td class="px-6 py-4 font-mono text-sm opacity-50">{{ course.id }}</td>
                        <td class="px-6 py-4 font-bold text-nm-primary uppercase tracking-tight">{{ course.title }}</td>
                        <td class="px-6 py-4 text-sm opacity-70 leading-relaxed">{{ course.description[:80] }}...</td>
                        <td class="px-6 py-4">
                            <p
                                class="text-[10px] font-semibold text-nm-text bg-nm-primary bg-opacity-10 px-3 py-1 rounded-lg inline-block">
                                {{ course.skills_required }}
                            </p>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
